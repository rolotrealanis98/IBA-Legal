name: Deploy to Cloudflare Pages

# main → production; any other branch → preview at https://<branch>.iba-legal.pages.dev
# Direct Upload (no CF git integration) — this Action is the only auto-deploy path.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages (main → production, branches → preview)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4a06fd515aaed0451b97fcf2606264ab
          command: pages deploy _site --project-name=iba-legal --branch=${{ github.ref_name }} --commit-dirty=true
